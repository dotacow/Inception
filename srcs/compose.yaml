services:
  wordpress:
    build:
      context: ./requirements/wordpress
      args:
        - ALPINE_VERSION=${ALPINE_VERSION}
    container_name: wordpress
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_net
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wp", "core", "is-installed", "--allow-root", "--path=/var/www/html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  mariadb:
    build:
      context: ./requirements/mariadb
      args:
        - ALPINE_VERSION=${ALPINE_VERSION}
    container_name: mariadb
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -u root --password=\"$(cat /run/secrets/db_root_password)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
  nginx:
    build:
      context: ./requirements/nginx
      args:
        - ALPINE_VERSION=${ALPINE_VERSION}
    container_name: nginx
    restart: on-failure
    env_file:
      - .env
    ports:
      - "${NGINX_IP}:443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_net
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  inception_net:
    name: inception_net

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mariadb

secrets:
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_password:
    file: ../secrets/wp_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt